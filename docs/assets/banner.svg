<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="nbt-evo-wired-carplay: wired Apple CarPlay for the BMW NBT Evo, through the head unit's own receiver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14233b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset="1" stop-color="#0f1c2e"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#4895ef"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280"/>
    <path d="M160 0V360M320 0V360M480 0V360M640 0V360M800 0V360M960 0V360M1120 0V360"/>
  </g>

  <!-- title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#e6edf7" font-size="58" font-weight="700" letter-spacing="-0.5">nbt-evo-wired-carplay</text>
    <text x="74" y="182" fill="#9fb3cc" font-size="26">Wired Apple CarPlay for the BMW NBT Evo (ID6),</text>
    <text x="74" y="216" fill="#9fb3cc" font-size="26">through the head unit's own receiver</text>
    <g font-size="18" fill="#cfe7ff">
      <rect x="74" y="252" width="128" height="34" rx="17" fill="#4cc9f0" fill-opacity="0.14" stroke="#4cc9f0" stroke-opacity="0.5"/>
      <text x="138" y="275" text-anchor="middle">PCM audio</text>
      <rect x="214" y="252" width="150" height="34" rx="17" fill="#4cc9f0" fill-opacity="0.14" stroke="#4cc9f0" stroke-opacity="0.5"/>
      <text x="289" y="275" text-anchor="middle">Siri + car mic</text>
      <rect x="376" y="252" width="160" height="34" rx="17" fill="#4cc9f0" fill-opacity="0.14" stroke="#4cc9f0" stroke-opacity="0.5"/>
      <text x="456" y="275" text-anchor="middle">cluster + HUD</text>
      <rect x="548" y="252" width="132" height="34" rx="17" fill="#4cc9f0" fill-opacity="0.14" stroke="#4cc9f0" stroke-opacity="0.5"/>
      <text x="614" y="275" text-anchor="middle">no laptop</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(790 86)">
    <rect x="0" y="0" width="104" height="196" rx="20" fill="#0d1726" stroke="#7d93ad" stroke-width="3"/>
    <rect x="9" y="14" width="86" height="160" rx="10" fill="url(#screen)"/>
    <rect x="38" y="6" width="28" height="5" rx="2.5" fill="#7d93ad"/>
    <g fill="#4cc9f0" fill-opacity="0.85">
      <rect x="20" y="28" width="18" height="18" rx="5"/><rect x="43" y="28" width="18" height="18" rx="5"/><rect x="66" y="28" width="18" height="18" rx="5"/>
      <rect x="20" y="52" width="18" height="18" rx="5"/><rect x="43" y="52" width="18" height="18" rx="5"/><rect x="66" y="52" width="18" height="18" rx="5"/>
    </g>
    <rect x="44" y="196" width="16" height="10" rx="2" fill="#7d93ad"/>
  </g>

  <!-- cable -->
  <path d="M842 292 C842 330, 930 330, 960 300 S1010 250, 1010 236" fill="none" stroke="url(#cable)" stroke-width="5" stroke-linecap="round"/>
  <rect x="1000" y="222" width="20" height="16" rx="3" fill="#4895ef"/>

  <!-- head unit screen -->
  <g transform="translate(940 96)">
    <rect x="0" y="0" width="300" height="118" rx="12" fill="#0d1726" stroke="#7d93ad" stroke-width="3"/>
    <rect x="10" y="10" width="280" height="98" rx="6" fill="url(#screen)"/>
    <rect x="20" y="20" width="70" height="78" rx="6" fill="#4cc9f0" fill-opacity="0.18"/>
    <g fill="#4cc9f0" fill-opacity="0.85">
      <rect x="104" y="24" width="34" height="34" rx="9"/><rect x="148" y="24" width="34" height="34" rx="9"/><rect x="192" y="24" width="34" height="34" rx="9"/><rect x="236" y="24" width="34" height="34" rx="9"/>
    </g>
    <rect x="104" y="70" width="166" height="8" rx="4" fill="#9fb3cc" fill-opacity="0.5"/>
    <rect x="104" y="86" width="110" height="8" rx="4" fill="#9fb3cc" fill-opacity="0.3"/>
  </g>
</svg>
